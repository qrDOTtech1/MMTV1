[package]
name = "enginebtb3_rust"
version = "0.1.0"
edition = "2021"

# Composant isole, jamais branche au bot Python qui trade (Steven 04/08).
# Objectif unique de cette premiere etape : mesurer, sur NOTRE machine/reseau,
# si Rust bat vraiment Python la ou ca compte (WS parsing, construction +
# signature EIP-712 d'ordre) -- pas se fier a des benchmarks d'un autre setup.

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy-primitives = "0.8"
alloy-sol-types = "0.8"
alloy-signer = "0.6"
alloy-signer-local = "0.6"
rand = "0.8"
hex = "0.4"
url = "2"
